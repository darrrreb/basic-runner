name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Trust server certificate
        run: |
          echo "${{ secrets.REGISTRY_CERT }}" | base64 -d > registry.crt
          sudo mkdir -p /etc/docker/certs.d/${{ secrets.PI_REGISTRY }}
          sudo cp registry.crt /etc/docker/certs.d/${{ secrets.PI_REGISTRY }}/ca.crt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          config-inline: |
            [registry."${{ secrets.PI_REGISTRY }}"]
              ca=["registry.crt"]

      - name: Build test stage
        uses: docker/build-push-action@v5
        with:
          context: app
          target: builder
          push: false
          platforms: linux/amd64
          load: true
          tags: basic-runner:test

      - name: Run tests
        run: |
          docker run --rm basic-runner:test uv run pytest tests/basic_test.py -v

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: app
          target: prod
          push: true
          tags: ${{ secrets.PI_REGISTRY }}/basic-runner:latest
          platforms: linux/arm64

      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to k3s
        run: |
          kubectl --kubeconfig=kubeconfig.yaml apply -f deployment.yaml

      - name: Verify deployment
        run: |
          kubectl --kubeconfig=kubeconfig.yaml rollout status deployment/basic-runner -n darrrreb
